[project]
name = "dollardrop"
version = "0.1.0"
description = "QR/link USDC drops on Arc: recipients claim with nothing but a phone."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "web3>=7.6,<8",
    "eth-account>=0.13",
    "py-solc-x>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "eth-tester[py-evm]>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dollardrop"]

[tool.uv]
# web3 asks for eth-hash[pysha3], which has no Windows wheel and needs MSVC to build.
# pycryptodome is a pure-wheel keccak backend that eth-hash also supports.
override-dependencies = ["eth-hash[pycryptodome]>=0.7"]
